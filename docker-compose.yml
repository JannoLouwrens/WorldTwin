# WorldTwin — stand-alone compose.
# This file lives at /home/opc/worldtwin/docker-compose.yml
# WorldTwin sits on a DEDICATED network (worldtwin_edge) that is ONLY
# bridged by OpenClaw's Caddy reverse proxy. Company agents on openclaw's
# frontend/backend networks cannot reach aggregator at L2.

services:

  # ==========================================
  # AGGREGATOR — WorldTwin data aggregator
  # ==========================================
  aggregator:
    build:
      context: ./aggregator
      dockerfile: Dockerfile
    container_name: aggregator
    restart: unless-stopped
    init: true
    expose:
      - "8090"
    volumes:
      - ./cache:/cache
      - /data/history:/history
      - ./aggregator/worldtwin:/app/worldtwin
    env_file:
      - .env
    environment:
      - CACHE_DIR=/cache
      - HISTORY_DIR=/history
      - HISTORY_DB=/history/history.sqlite
    networks:
      - worldtwin_edge
    healthcheck:
      # Image is python:3.12-slim — no curl; use stdlib urllib instead.
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8090/api/health',timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 3G
          cpus: "2.0"

networks:
  # Dedicated network — only Caddy (OpenClaw side) joins this from the
  # outside. Everything else on WorldTwin's side stays L2-isolated from
  # OpenClaw's company agents.
  worldtwin_edge:
    external: true
    name: worldtwin_edge
