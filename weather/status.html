<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Status — every source, its state, and why — WorldTwin</title>
<meta name="description" content="The full source ledger: every registered layer with its computed state, last success time, and — for retired layers — the dated reason.">
<style>
:root { --ink:#161310; --paper:#f8f5ef; --rule:#d9d2c3; --muted:#6b6459;
        --accent:#1d4ed8; --warn:#92400e; --card:#fffdf7;
        --c-live:#15803d; --c-stale:#b45309; --c-dead:#b91c1c; --c-retired:#6b7280; }
@media (prefers-color-scheme: dark) {
  :root { --ink:#e8e4da; --paper:#15171c; --rule:#34373f; --muted:#9a958a;
          --accent:#8ab0ff; --warn:#e0a458; --card:#1b1e25;
          --c-live:#4ade80; --c-stale:#fbbf24; --c-dead:#f87171; --c-retired:#9ca3af; }
}
* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--paper); color:var(--ink); line-height:1.55;
  font-family: Georgia, 'Iowan Old Style', 'Times New Roman', Times, serif; }
.wrap { max-width:880px; margin:0 auto; padding:40px 22px 80px; }
header.mast { border-bottom:3px double var(--ink); padding-bottom:14px; margin-bottom:20px; }
.kicker { font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace; font-size:11px;
  letter-spacing:.22em; text-transform:uppercase; color:var(--warn); }
h1 { font-size:34px; font-weight:700; letter-spacing:-.5px; line-height:1.1; margin-top:6px; }
#countsLine { font-family:ui-monospace,monospace; font-size:15px; margin-top:12px;
  font-variant-numeric: tabular-nums; }
#metaLine { font-family:ui-monospace,monospace; font-size:11px; color:var(--muted); margin-top:6px; }
#metaLine.down { color:var(--warn); }
.fail { border:1px solid var(--warn); color:var(--warn); background:var(--card);
  padding:14px 16px; margin:20px 0; font-size:16px; }
.tblwrap { overflow-x:auto; margin-top:18px; }
table { border-collapse:collapse; width:100%; font-size:14px; }
th { font-family:ui-monospace,monospace; font-size:10.5px; letter-spacing:.14em;
  text-transform:uppercase; color:var(--muted); text-align:left; padding:8px 10px;
  border-bottom:2px solid var(--rule); }
td { padding:7px 10px; border-bottom:1px solid var(--rule); vertical-align:top; }
td.mono, .mono { font-family:ui-monospace,monospace; font-size:12px; }
.chip { display:inline-block; font-family:ui-monospace,monospace; font-size:10.5px;
  letter-spacing:.08em; text-transform:uppercase; padding:1px 8px; border-radius:999px;
  border:1px solid currentColor; }
.st-live { color:var(--c-live); } .st-stale { color:var(--c-stale); }
.st-dead { color:var(--c-dead); } .st-retired { color:var(--c-retired); }
.st-other { color:var(--muted); }
.reason { color:var(--muted); font-size:13px; }
a { color:var(--accent); }
footer { margin-top:40px; border-top:3px double var(--ink); padding-top:14px;
  font-size:12px; color:var(--muted); font-family:ui-monospace,monospace; line-height:1.9; }
</style>
</head>
<body><div class="wrap">

<header class="mast">
  <div class="kicker">WorldTwin · Source ledger</div>
  <h1>Status</h1>
  <div id="countsLine">reading the contract file…</div>
  <div id="metaLine"></div>
</header>

<div id="content"></div>

<footer>
  every state on this page is computed from
  <a href="/api/cache/v1/manifest.json">/api/cache/v1/manifest.json</a> at page load —
  nothing here is hand-written ·
  <a href="/worldtwin/brief/">brief</a> · <a href="/worldtwin/charter.html">charter</a> ·
  <a href="/worldtwin/v2/">globe</a>
</footer>

</div>
<script>
(async function () {
  var countsEl = document.getElementById('countsLine');
  var metaEl = document.getElementById('metaLine');
  var contentEl = document.getElementById('content');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function fail(msg) {
    countsEl.textContent = 'status unavailable';
    contentEl.innerHTML = '<div class="fail">' + esc(msg) + '</div>';
  }
  function normState(s) {
    s = String(s || 'unknown').toLowerCase();
    if (s === 'ok') return 'live';
    return s;
  }
  function ageOf(ts) {
    if (!ts) return '—';
    var t = Date.parse(ts);
    if (isNaN(t)) return '—';
    var s = (Date.now() - t) / 1000;
    if (s < 0) return 'future?';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 172800) return (s / 3600).toFixed(1) + ' h ago';
    return (s / 86400).toFixed(1) + ' d ago';
  }
  function licName(lic) {
    if (!lic) return '—';
    if (typeof lic === 'string') return lic;
    return lic.name || lic.id || '—';
  }

  var man = null;
  try {
    var r = await fetch('/api/cache/v1/manifest.json', { cache: 'no-store' });
    if (r.ok) man = await r.json();
  } catch (e) { /* rendered below as an honest failure */ }

  if (!man || !Array.isArray(man.layers)) {
    fail('status unavailable — aggregator contract file missing ' +
         '(/api/cache/v1/manifest.json did not load). The states of the sources ' +
         'cannot be shown, and that absence is itself the status.');
    return;
  }

  // Counts are ALWAYS computed from the layer rows — never hardcoded, never trusted
  // from a hand-written number.
  var tally = { live: 0, stale: 0, dead: 0, retired: 0 };
  man.layers.forEach(function (l) {
    var st = normState(l.state);
    if (tally[st] !== undefined) tally[st]++;
  });
  var total = man.layers.length;
  countsEl.textContent = tally.live + ' live · ' + tally.stale + ' stale · ' +
    tally.dead + ' dead · ' + tally.retired + ' retired of ' + total;

  if (man.generated_at) {
    var genAge = (Date.now() - Date.parse(man.generated_at)) / 1000;
    metaEl.textContent = 'manifest generated ' + man.generated_at +
      ' (' + ageOf(man.generated_at) + ')';
    if (genAge > 3600) {
      metaEl.classList.add('down');
      metaEl.textContent += ' — older than an hour: the aggregator may be down; ' +
        'states below are the last on record.';
    }
  }

  var order = { live: 0, stale: 1, dead: 2, retired: 3 };
  var rows = man.layers.slice().sort(function (a, b) {
    var sa = order[normState(a.state)], sb = order[normState(b.state)];
    sa = sa === undefined ? 9 : sa; sb = sb === undefined ? 9 : sb;
    if (sa !== sb) return sa - sb;
    return String(a.id).localeCompare(String(b.id));
  }).map(function (l) {
    var st = normState(l.state);
    var cls = order[st] !== undefined ? 'st-' + st : 'st-other';
    var reason = '';
    if (st === 'retired') {
      reason = l.reason || l.retired_reason || l.state_detail || 'retired';
    } else if (st === 'stale' || st === 'dead') {
      reason = l.state_detail || (l.stale_since ? 'stale since ' + l.stale_since : '');
    }
    return '<tr>' +
      '<td class="mono">' + esc(l.id) + '</td>' +
      '<td>' + esc(l.name || '') +
        (reason ? '<div class="reason">' + esc(reason) + '</div>' : '') + '</td>' +
      '<td><span class="chip ' + cls + '">' + esc(st) + '</span></td>' +
      '<td class="mono">' + esc(ageOf(l.last_success_at)) + '</td>' +
      '<td class="mono">' + esc(licName(l.license)) + '</td>' +
      '</tr>';
  }).join('');

  contentEl.innerHTML = '<div class="tblwrap"><table>' +
    '<thead><tr><th>id</th><th>name / reason</th><th>state</th>' +
    '<th>last success</th><th>licence</th></tr></thead>' +
    '<tbody>' + rows + '</tbody></table></div>';
})();
</script>
</body></html>
